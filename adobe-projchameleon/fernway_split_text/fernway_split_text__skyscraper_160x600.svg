<svg xmlns="http://www.w3.org/2000/svg" id="fernway_split_text_skyscraper_160x600" width="160" height="600" viewBox="0 0 160 600">
  <rect id="bg" x="0" y="0" width="160" height="600" fill="#F4EFE6"/>
  <rect id="photo" x="10" y="10" width="140" height="150" fill="#1F3D2B" fill-opacity="0.18" stroke="#1F3D2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect id="accent_bar" x="12" y="239.2" width="30" height="3" fill="#B04E28"/>
  <rect id="logo" x="12" y="210.2" width="92" height="23" fill="#1F3D2B" fill-opacity="0.18" stroke="#1F3D2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <text id="eyebrow" font-family="Solstice Sans" font-size="10" font-weight="700" fill="#B04E28" text-anchor="start">
    <tspan x="12.0" y="255.4" fill="#B04E28">PLANT CARE,</tspan>
    <tspan x="12.0" y="267.4" fill="#B04E28">SIMPLIFIED</tspan>
  </text>
  <text id="headline" font-family="Solstice Serif" font-size="17" font-weight="700" fill="#1F3D2B" text-anchor="start">
    <tspan x="12.0" y="288.0" fill="#1F3D2B">Never guess</tspan>
    <tspan x="12.0" y="306.7" fill="#1F3D2B">when to</tspan>
    <tspan x="12.0" y="325.4" fill="#1F3D2B">water again</tspan>
  </text>
  <text id="body" font-family="Solstice Sans" font-size="10" font-weight="400" fill="#3A5242" text-anchor="start">
    <tspan x="12.0" y="343.2" fill="#3A5242">Every Fernway plant</tspan>
    <tspan x="12.0" y="356.8" fill="#3A5242">ships with a care card</tspan>
    <tspan x="12.0" y="370.2" fill="#3A5242">and watering reminders</tspan>
    <tspan x="12.0" y="383.8" fill="#3A5242">matched to the light in</tspan>
    <tspan x="12.0" y="397.2" fill="#3A5242">your home.</tspan>
  </text>
  <text id="perks" font-family="Solstice Sans" font-size="10" font-weight="700" fill="#1F3D2B" text-anchor="start">
    <tspan x="12.0" y="414.8" fill="#1F3D2B">Free delivery over</tspan>
    <tspan x="12.0" y="428.2" fill="#1F3D2B">$40. 30-day health</tspan>
    <tspan x="12.0" y="441.8" fill="#1F3D2B">guarantee.</tspan>
    <tspan x="12.0" y="455.2" fill="#1F3D2B">Pet-safe options.</tspan>
  </text>
  <g id="cta">
    <rect id="cta_bg" x="12" y="466.8" width="136" height="44" rx="22.0" fill="#1F3D2B"/>
    <text id="cta_label" font-family="Solstice Sans" font-size="11" font-weight="700" fill="#FAF7F1" text-anchor="middle">
      <tspan x="80.0" y="492.3" fill="#FAF7F1">Take the plant quiz</tspan>
    </text>
  </g>
  <text id="footnote" font-family="Solstice Sans" font-size="10" font-weight="400" fill="#3A5242" text-anchor="start">
    <tspan x="12.0" y="526.5" fill="#3A5242">Guarantee applies</tspan>
    <tspan x="12.0" y="539.5" fill="#3A5242">to plants cared for</tspan>
    <tspan x="12.0" y="552.5" fill="#3A5242">as directed.</tspan>
  </text>
</svg>