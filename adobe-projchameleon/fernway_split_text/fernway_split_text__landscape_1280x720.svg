<svg xmlns="http://www.w3.org/2000/svg" id="fernway_split_text_landscape_1280x720" width="1280" height="720" viewBox="0 0 1280 720">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#F4EFE6"/>
  <rect id="photo" x="40" y="40" width="460" height="640" fill="#1F3D2B" fill-opacity="0.18" stroke="#1F3D2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect id="accent_bar" x="540" y="202.7" width="50" height="5" fill="#B04E28"/>
  <rect id="logo" x="540" y="139.7" width="160" height="40" fill="#1F3D2B" fill-opacity="0.18" stroke="#1F3D2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <text id="eyebrow" font-family="Solstice Sans" font-size="18" font-weight="700" fill="#B04E28" text-anchor="start">
    <tspan x="540.0" y="238.3" fill="#B04E28">PLANT CARE, SIMPLIFIED</tspan>
  </text>
  <text id="headline" font-family="Solstice Serif" font-size="46" font-weight="700" fill="#1F3D2B" text-anchor="start">
    <tspan x="540.0" y="290.3" fill="#1F3D2B">Never guess when</tspan>
    <tspan x="540.0" y="340.9" fill="#1F3D2B">to water again</tspan>
  </text>
  <text id="body" font-family="Solstice Sans" font-size="20" font-weight="400" fill="#3A5242" text-anchor="start">
    <tspan x="540.0" y="385.4" fill="#3A5242">Every Fernway plant ships with a care card and</tspan>
    <tspan x="540.0" y="412.4" fill="#3A5242">watering reminders matched to the light in your home.</tspan>
  </text>
  <text id="perks" font-family="Solstice Sans" font-size="18" font-weight="700" fill="#1F3D2B" text-anchor="start">
    <tspan x="540.0" y="449.4" fill="#1F3D2B">Free delivery over $40. 30-day health guarantee. Pet-safe options.</tspan>
  </text>
  <g id="cta">
    <rect id="cta_bg" x="540" y="475.8" width="300" height="66" rx="33.0" fill="#1F3D2B"/>
    <text id="cta_label" font-family="Solstice Sans" font-size="24" font-weight="700" fill="#FAF7F1" text-anchor="middle">
      <tspan x="690.0" y="516.5" fill="#FAF7F1">Take the plant quiz</tspan>
    </text>
  </g>
  <text id="footnote" font-family="Solstice Sans" font-size="15" font-weight="400" fill="#3A5242" text-anchor="start">
    <tspan x="540.0" y="575.3" fill="#3A5242">Guarantee applies to plants cared for as directed.</tspan>
  </text>
</svg>