<svg xmlns="http://www.w3.org/2000/svg" id="ridgeline_overlay_image_skyscraper_160x600" width="160" height="600" viewBox="0 0 160 600">
  <rect id="bg_photo" x="0" y="0" width="160" height="600" fill="#121C2B" fill-opacity="0.18" stroke="#121C2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect id="inset_1" x="44" y="60" width="100" height="100" fill="#121C2B" fill-opacity="0.18" stroke="#121C2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect id="inset_2" x="16" y="140" width="90" height="90" fill="#121C2B" fill-opacity="0.18" stroke="#121C2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g id="caption">
    <rect id="caption_bg" x="8" y="10" width="144" height="26" rx="13.0" fill="#121C2B" opacity="0.88"/>
    <text id="caption_label" font-family="Solstice Sans" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <tspan x="80.0" y="26.2" fill="#FFFFFF">Shot on Mount Rainier</tspan>
