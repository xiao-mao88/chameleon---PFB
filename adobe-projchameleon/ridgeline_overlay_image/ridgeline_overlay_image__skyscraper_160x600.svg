  <text id="headline" font-family="Solstice Serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">
    <tspan x="20.0" y="460.1" fill="#FFFFFF">Made for</tspan>
    <tspan x="20.0" y="483.9" fill="#FFFFFF">the climb</tspan>
  </text>
  <g id="cta">
