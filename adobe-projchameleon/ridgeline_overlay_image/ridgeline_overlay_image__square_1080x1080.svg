    <text id="caption_label" font-family="Solstice Sans" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <tspan x="230.0" y="93.0" fill="#FFFFFF">Shot on Mount Rainier</tspan>
    </text>
  </g>
  <rect id="panel" x="60" y="600" width="560" height="420" rx="25.2" fill="#121C2B" opacity="0.88"/>
