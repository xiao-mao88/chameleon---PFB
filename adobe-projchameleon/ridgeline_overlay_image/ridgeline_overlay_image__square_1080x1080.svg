<svg xmlns="http://www.w3.org/2000/svg" id="ridgeline_overlay_image_square_1080x1080" width="1080" height="1080" viewBox="0 0 1080 1080">
  <rect id="bg_photo" x="0" y="0" width="1080" height="1080" fill="#121C2B" fill-opacity="0.18" stroke="#121C2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect id="inset_1" x="640" y="80" width="360" height="360" fill="#121C2B" fill-opacity="0.18" stroke="#121C2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect id="inset_2" x="650" y="400" width="300" height="300" fill="#121C2B" fill-opacity="0.18" stroke="#121C2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g id="caption">
