  <text id="headline" font-family="Solstice Serif" font-size="62" font-weight="700" fill="#FFFFFF" text-anchor="start">
    <tspan x="104.0" y="784.3" fill="#FFFFFF">Made for</tspan>
    <tspan x="104.0" y="851.3" fill="#FFFFFF">the climb</tspan>
  </text>
  <g id="cta">
