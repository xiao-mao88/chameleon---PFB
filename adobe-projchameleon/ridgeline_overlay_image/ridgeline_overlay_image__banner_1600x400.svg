  <text id="headline" font-family="Solstice Serif" font-size="54" font-weight="700" fill="#FFFFFF" text-anchor="start">
    <tspan x="60.0" y="176.1" fill="#FFFFFF">Made for</tspan>
    <tspan x="60.0" y="234.5" fill="#FFFFFF">the climb</tspan>
  </text>
  <g id="cta">
    <rect id="cta_bg" x="60" y="268.3" width="180" height="70" rx="35.0" fill="#C6E84A"/>
