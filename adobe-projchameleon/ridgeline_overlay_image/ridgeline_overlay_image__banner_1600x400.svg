<svg xmlns="http://www.w3.org/2000/svg" id="ridgeline_overlay_image_banner_1600x400" width="1600" height="400" viewBox="0 0 1600 400">
  <rect id="bg_photo" x="0" y="0" width="1600" height="400" fill="#121C2B" fill-opacity="0.18" stroke="#121C2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect id="inset_1" x="1080" y="30" width="220" height="220" fill="#121C2B" fill-opacity="0.18" stroke="#121C2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect id="inset_2" x="1300" y="150" width="220" height="220" fill="#121C2B" fill-opacity="0.18" stroke="#121C2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g id="caption">
    <rect id="caption_bg" x="700" y="320" width="250" height="44" rx="22.0" fill="#121C2B" opacity="0.88"/>
    <text id="caption_label" font-family="Solstice Sans" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <tspan x="825.0" y="347.8" fill="#FFFFFF">Shot on Mount Rainier</tspan>
    </text>
  </g>
  <rect id="panel" x="30" y="30" width="620" height="340" rx="20.4" fill="#121C2B" opacity="0.88"/>
