<svg xmlns="http://www.w3.org/2000/svg" id="ridgeline_overlay_text_landscape_1280x720" width="1280" height="720" viewBox="0 0 1280 720">
  <rect id="bg_photo" x="0" y="0" width="1280" height="720" fill="#121C2B" fill-opacity="0.18" stroke="#121C2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect id="panel" x="50" y="40" width="760" height="640" rx="38.4" fill="#121C2B" opacity="0.9"/>
  <rect id="divider" x="94" y="337.5" width="44" height="3" fill="#C6E84A"/>
  <rect id="logo" x="94" y="127.1" width="150" height="50" fill="#121C2B" fill-opacity="0.18" stroke="#121C2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <text id="eyebrow" font-family="Solstice Sans" font-size="17" font-weight="700" fill="#C6E84A" text-anchor="start">
    <tspan x="94.0" y="212.7" fill="#C6E84A">SPRING TRAIL SERIES</tspan>
  </text>
  <text id="headline" font-family="Solstice Serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="start">
    <tspan x="94.0" y="265.3" fill="#FFFFFF">Five races. One season.</tspan>
    <tspan x="94.0" y="312.9" fill="#FFFFFF">Every kind of weather.</tspan>
  </text>
  <text id="body" font-family="Solstice Sans" font-size="19" font-weight="400" fill="#CED6E2" text-anchor="start">
    <tspan x="94.0" y="374.4" fill="#CED6E2">Run 10K to 50K courses through three state parks,</tspan>
    <tspan x="94.0" y="400.1" fill="#CED6E2">with aid stations every five miles.</tspan>
  </text>
  <text id="details" font-family="Solstice Sans" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">
    <tspan x="94.0" y="437.7" fill="#FFFFFF">Registration closes April 30. Entry</tspan>
    <tspan x="94.0" y="462.0" fill="#FFFFFF">includes a timing chip and finisher medal.</tspan>
  </text>
  <g id="cta">
    <rect id="cta_bg" x="94" y="488.4" width="360" height="66" rx="33.0" fill="#C6E84A"/>
    <text id="cta_label" font-family="Solstice Sans" font-size="24" font-weight="700" fill="#121C2B" text-anchor="middle">
      <tspan x="274.0" y="529.1" fill="#121C2B">Register for the series</tspan>
    </text>
  </g>
  <text id="footnote" font-family="Solstice Sans" font-size="15" font-weight="400" fill="#CED6E2" text-anchor="start">
    <tspan x="94.0" y="587.9" fill="#CED6E2">Races may be rescheduled for safety.</tspan>
  </text>
</svg>