<svg xmlns="http://www.w3.org/2000/svg" width="160" height="600" viewBox="0 0 160 600">
  <rect id="bg" x="0" y="0" width="160" height="600" fill="#2E1B30"/>
  <rect id="product_img" x="50.0" y="111.9" width="60" height="100" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect id="logo" x="20.0" y="59.9" width="120" height="40" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <text id="eyebrow" font-family="Solstice Sans" font-size="10" font-weight="700" fill="#FFC13B" text-anchor="middle">
    <tspan x="80.0" y="235.1" fill="#FFC13B">NEW FOR SUMMER</tspan>
  </text>
  <text id="headline" font-family="Solstice Serif" font-size="28" font-weight="700" fill="#FFF7ED" text-anchor="middle">
    <tspan x="80.0" y="266.3" fill="#FFF7ED">Chase</tspan>
    <tspan x="80.0" y="297.1" fill="#FFC13B">the</tspan>
    <tspan x="80.0" y="327.9" fill="#FFC13B">Light</tspan>
  </text>
  <text id="subhead" font-family="Solstice Sans" font-size="11" font-weight="400" fill="#E8D6E0" text-anchor="middle">
    <tspan x="80.0" y="353.0" fill="#E8D6E0">Botanical sparkling</tspan>
    <tspan x="80.0" y="367.3" fill="#E8D6E0">infusions, crafted</tspan>
    <tspan x="80.0" y="381.6" fill="#E8D6E0">for golden hour.</tspan>
  </text>
  <text id="features" font-family="Solstice Sans" font-size="11" font-weight="400" fill="#FFF7ED" text-anchor="middle">
    <tspan x="80.0" y="403.9" fill="#FFF7ED">Real botanicals.</tspan>
    <tspan x="80.0" y="418.2" fill="#FFF7ED">No added sugar.</tspan>
    <tspan x="80.0" y="432.5" fill="#FFF7ED">45 calories a can.</tspan>
  </text>
  <g id="cta">
    <rect id="cta_bg" x="16.0" y="448.1" width="128" height="56" rx="16" fill="#FF6B4A"/>
    <text id="cta_label" font-family="Solstice Sans" font-size="13" font-weight="700" fill="#FFF7ED" text-anchor="middle">
      <tspan x="80.0" y="472.5" fill="#FFF7ED">Shop the</tspan>
      <tspan x="80.0" y="488.1" fill="#FFF7ED">Summer Line</tspan>
    </text>
  </g>
  <text id="footnote" font-family="Solstice Sans" font-size="10" font-weight="400" fill="#E8D6E0" text-anchor="middle">
    <tspan x="80.0" y="523.8" fill="#E8D6E0">Available at select retailers</tspan>
    <tspan x="80.0" y="536.8" fill="#E8D6E0">while supplies last.</tspan>
  </text>
</svg>