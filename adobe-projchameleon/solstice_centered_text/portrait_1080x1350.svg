<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect id="bg" x="0" y="0" width="1080" height="1350" fill="#2E1B30"/>
  <rect id="product_img" x="450.0" y="247.5" width="180" height="300" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect id="logo" x="420.0" y="143.5" width="240" height="80" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <text id="eyebrow" font-family="Solstice Sans" font-size="28" font-weight="700" fill="#FFC13B" text-anchor="middle">
    <tspan x="540.0" y="609.3" fill="#FFC13B">NEW FOR SUMMER</tspan>
  </text>
  <text id="headline" font-family="Solstice Serif" font-size="100" font-weight="700" fill="#FFF7ED" text-anchor="middle">
    <tspan x="540.0" y="716.1" fill="#FFF7ED">Chase</tspan>
    <tspan x="540.0" y="826.1" fill="#FFC13B">the Light</tspan>
  </text>
  <text id="subhead" font-family="Solstice Sans" font-size="34" font-weight="400" fill="#E8D6E0" text-anchor="middle">
    <tspan x="540.0" y="902.1" fill="#E8D6E0">Botanical sparkling infusions,</tspan>
    <tspan x="540.0" y="946.3" fill="#E8D6E0">crafted for golden hour.</tspan>
  </text>
  <text id="features" font-family="Solstice Sans" font-size="28" font-weight="400" fill="#FFF7ED" text-anchor="middle">
    <tspan x="540.0" y="1008.7" fill="#FFF7ED">Real botanicals. No added sugar. 45 calories a can.</tspan>
  </text>
  <g id="cta">
    <rect id="cta_bg" x="290.0" y="1053.9" width="500" height="96" rx="48.0" fill="#FF6B4A"/>
    <text id="cta_label" font-family="Solstice Sans" font-size="32" font-weight="700" fill="#FFF7ED" text-anchor="middle">
      <tspan x="540.0" y="1112.1" fill="#FFF7ED">Shop the Summer Line</tspan>
    </text>
  </g>
  <text id="footnote" font-family="Solstice Sans" font-size="22" font-weight="400" fill="#E8D6E0" text-anchor="middle">
    <tspan x="540.0" y="1199.2" fill="#E8D6E0">Available at select retailers while supplies last.</tspan>
  </text>
</svg>