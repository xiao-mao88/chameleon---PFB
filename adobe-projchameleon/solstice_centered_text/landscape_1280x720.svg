<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#2E1B30"/>
  <rect id="product_img" x="160" y="150" width="252" height="420" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect id="logo" x="620" y="55.7" width="210" height="70" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <text id="eyebrow" font-family="Solstice Sans" font-size="22" font-weight="700" fill="#FFC13B" text-anchor="start">
    <tspan x="620.0" y="169.9" fill="#FFC13B">NEW FOR SUMMER</tspan>
  </text>
  <text id="headline" font-family="Solstice Serif" font-size="80" font-weight="700" fill="#FFF7ED" text-anchor="start">
    <tspan x="620.0" y="255.7" fill="#FFF7ED">Chase</tspan>
    <tspan x="620.0" y="343.7" fill="#FFC13B">the Light</tspan>
  </text>
  <text id="subhead" font-family="Solstice Sans" font-size="26" font-weight="400" fill="#E8D6E0" text-anchor="start">
    <tspan x="620.0" y="405.3" fill="#E8D6E0">Botanical sparkling infusions,</tspan>
    <tspan x="620.0" y="439.1" fill="#E8D6E0">crafted for golden hour.</tspan>
  </text>
  <text id="features" font-family="Solstice Sans" font-size="22" font-weight="400" fill="#FFF7ED" text-anchor="start">
    <tspan x="620.0" y="485.0" fill="#FFF7ED">Real botanicals. No added sugar.</tspan>
    <tspan x="620.0" y="513.6" fill="#FFF7ED">45 calories a can.</tspan>
  </text>
  <g id="cta">
    <rect id="cta_bg" x="620" y="548.9" width="380" height="72" rx="36.0" fill="#FF6B4A"/>
    <text id="cta_label" font-family="Solstice Sans" font-size="26" font-weight="700" fill="#FFF7ED" text-anchor="middle">
      <tspan x="810.0" y="593.2" fill="#FFF7ED">Shop the Summer Line</tspan>
    </text>
  </g>
  <text id="footnote" font-family="Solstice Sans" font-size="18" font-weight="400" fill="#E8D6E0" text-anchor="start">
    <tspan x="620.0" y="658.4" fill="#E8D6E0">Available at select retailers while supplies last.</tspan>
  </text>
</svg>