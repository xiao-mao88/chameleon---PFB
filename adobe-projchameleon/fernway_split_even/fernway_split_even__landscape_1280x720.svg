<svg xmlns="http://www.w3.org/2000/svg" id="fernway_split_even_landscape_1280x720" width="1280" height="720" viewBox="0 0 1280 720">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#F4EFE6"/>
  <rect id="color_block" x="30" y="100" width="520" height="580" fill="#A9BFA0"/>
  <rect id="photo" x="70" y="60" width="520" height="580" fill="#1F3D2B" fill-opacity="0.18" stroke="#1F3D2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect id="inset_img" x="470" y="460" width="200" height="200" fill="#1F3D2B" fill-opacity="0.18" stroke="#1F3D2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g id="badge">
    <ellipse id="badge_bg" cx="585.0" cy="109.0" rx="85.0" ry="85.0" fill="#B04E28"/>
    <text id="badge_label" font-family="Solstice Sans" font-size="40" font-weight="700" fill="#FAF7F1" text-anchor="middle">
      <tspan x="585.0" y="101.8" fill="#FAF7F1">20%</tspan>
      <tspan x="585.0" y="141.8" fill="#FAF7F1">off</tspan>
    </text>
  </g>
  <rect id="logo" x="720" y="85.7" width="180" height="45" fill="#1F3D2B" fill-opacity="0.18" stroke="#1F3D2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <text id="headline" font-family="Solstice Serif" font-size="56" font-weight="700" fill="#1F3D2B" text-anchor="start">
    <tspan x="720.0" y="213.4" fill="#1F3D2B">Bring the</tspan>
    <tspan x="720.0" y="275.0" fill="#1F3D2B">outdoors</tspan>
    <tspan x="720.0" y="336.6" fill="#1F3D2B">in, one leaf</tspan>
    <tspan x="720.0" y="398.2" fill="#1F3D2B">at a time</tspan>
  </text>
  <text id="body" font-family="Solstice Sans" font-size="24" font-weight="400" fill="#3A5242" text-anchor="start">
    <tspan x="720.0" y="455.0" fill="#3A5242">Healthy plants delivered to</tspan>
    <tspan x="720.0" y="487.4" fill="#3A5242">your door, with care guides</tspan>
    <tspan x="720.0" y="519.8" fill="#3A5242">written by real gardeners.</tspan>
  </text>
  <g id="cta">
    <rect id="cta_bg" x="720" y="562.3" width="240" height="72" rx="36.0" fill="#1F3D2B"/>
    <text id="cta_label" font-family="Solstice Sans" font-size="26" font-weight="700" fill="#FAF7F1" text-anchor="middle">
      <tspan x="840.0" y="606.6" fill="#FAF7F1">Shop plants</tspan>
    </text>
  </g>
</svg>