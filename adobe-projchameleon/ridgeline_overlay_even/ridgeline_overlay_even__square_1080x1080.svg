<svg xmlns="http://www.w3.org/2000/svg" id="ridgeline_overlay_even_square_1080x1080" width="1080" height="1080" viewBox="0 0 1080 1080">
  <rect id="bg_photo" x="0" y="0" width="1080" height="1080" fill="#121C2B" fill-opacity="0.18" stroke="#121C2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect id="product_img" x="640" y="90" width="384" height="240" fill="#121C2B" fill-opacity="0.18" stroke="#121C2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect id="panel" x="60" y="380" width="640" height="640" rx="38.4" fill="#121C2B" opacity="0.88"/>
  <g id="tag">
    <rect id="tag_bg" x="112" y="542.3" width="80" height="36" rx="18.0" fill="#FF7A29"/>
    <text id="tag_label" font-family="Solstice Sans" font-size="18" font-weight="700" fill="#121C2B" text-anchor="start">
      <tspan x="122.8" y="566.1" fill="#121C2B">NEW</tspan>
    </text>
  </g>
  <rect id="logo" x="112" y="452.3" width="180" height="60" fill="#121C2B" fill-opacity="0.18" stroke="#121C2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <text id="headline" font-family="Solstice Serif" font-size="66" font-weight="700" fill="#FFFFFF" text-anchor="start">
    <tspan x="112.0" y="655.1" fill="#FFFFFF">Run further</tspan>
    <tspan x="112.0" y="726.3" fill="#FFFFFF">than the map</tspan>
  </text>
  <text id="body" font-family="Solstice Sans" font-size="27" font-weight="400" fill="#CED6E2" text-anchor="start">
    <tspan x="112.0" y="787.7" fill="#CED6E2">Trail shoes tested on 2,000</tspan>
    <tspan x="112.0" y="824.1" fill="#CED6E2">miles of real mountain terrain.</tspan>
  </text>
  <g id="cta">
    <rect id="cta_bg" x="112" y="863.7" width="270" height="84" rx="42.0" fill="#C6E84A"/>
    <text id="cta_label" font-family="Solstice Sans" font-size="30" font-weight="700" fill="#121C2B" text-anchor="middle">
      <tspan x="247.0" y="915.3" fill="#121C2B">Find your fit</tspan>
    </text>
  </g>
</svg>