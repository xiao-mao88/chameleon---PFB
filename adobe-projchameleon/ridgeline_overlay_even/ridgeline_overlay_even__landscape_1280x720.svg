<svg xmlns="http://www.w3.org/2000/svg" id="ridgeline_overlay_even_landscape_1280x720" width="1280" height="720" viewBox="0 0 1280 720">
  <rect id="bg_photo" x="0" y="0" width="1280" height="720" fill="#121C2B" fill-opacity="0.18" stroke="#121C2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect id="product_img" x="740" y="400" width="464" height="290" fill="#121C2B" fill-opacity="0.18" stroke="#121C2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect id="panel" x="50" y="50" width="600" height="620" rx="36.0" fill="#121C2B" opacity="0.88"/>
  <g id="tag">
    <rect id="tag_bg" x="100" y="212.1" width="76" height="34" rx="17.0" fill="#FF7A29"/>
    <text id="tag_label" font-family="Solstice Sans" font-size="17" font-weight="700" fill="#121C2B" text-anchor="start">
      <tspan x="110.2" y="234.5" fill="#121C2B">NEW</tspan>
    </text>
  </g>
  <rect id="logo" x="100" y="123.1" width="180" height="60" fill="#121C2B" fill-opacity="0.18" stroke="#121C2B" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <text id="headline" font-family="Solstice Serif" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="start">
    <tspan x="100.0" y="320.1" fill="#FFFFFF">Run further</tspan>
    <tspan x="100.0" y="389.3" fill="#FFFFFF">than the map</tspan>
  </text>
  <text id="body" font-family="Solstice Sans" font-size="25" font-weight="400" fill="#CED6E2" text-anchor="start">
    <tspan x="100.0" y="447.3" fill="#CED6E2">Trail shoes tested on 2,000</tspan>
    <tspan x="100.0" y="481.0" fill="#CED6E2">miles of real mountain terrain.</tspan>
  </text>
  <g id="cta">
    <rect id="cta_bg" x="100" y="518.9" width="260" height="78" rx="39.0" fill="#C6E84A"/>
    <text id="cta_label" font-family="Solstice Sans" font-size="28" font-weight="700" fill="#121C2B" text-anchor="middle">
      <tspan x="230.0" y="566.9" fill="#121C2B">Find your fit</tspan>
    </text>
  </g>
</svg>